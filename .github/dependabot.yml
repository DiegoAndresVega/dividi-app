# Dependabot abre pull requests cuando sale una version nueva. Se revisa el
# aviso de seguridad de cada una antes de fusionarla: el CI dice si la suite
# pasa, no si el cambio es buena idea.
#
# Ojo con flutter_secure_storage: ahi viven los tokens de sesion, y un salto de
# major puede cambiar como se guardan. Ver el apartado de dependencias del
# README antes de fusionar uno.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
